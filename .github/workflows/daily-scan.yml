name: Günlük Reddit AI Trend Taraması & Canlı Dağıtım

on:
  schedule:
    # Her gün gece 03:00 TSİ (00:00 UTC) ve öğleden sonra 15:00 TSİ (12:00 UTC) çalışır
    - cron: '0 0,12 * * *'
  workflow_dispatch: # GitHub üzerinden tek tıkla manuel tetikleme

jobs:
  crawl-analyze-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Repoya commit & push izni

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci || npm install

      - name: 50 Reddit Sub Taraması & Gemini 3.8 Şelale Analizi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: npm run crawl

      - name: Siteyi Derle & Cloudflare Pages'e Doğrudan Canlıya Al
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run build
          npx wrangler pages deploy dist --project-name aitrendleri

      - name: Bilgilendirme E-postası Gönder
        env:
          ALICI_MAIL: ${{ secrets.ALICI_MAIL || 'orhaner1907@gmail.com' }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/send-notification.js

      - name: Güncel Verileri Git Deposuna Kaydet
        run: |
          git config --global user.name "AI Trend Bot"
          git config --global user.email "bot@aitrendleri.com"
          git add src/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Otonom Günlük Rapor Güncellemesi [skip ci]" && git push)
